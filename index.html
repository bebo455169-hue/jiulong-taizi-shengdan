<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>混元九龍太子聖誕祈福科儀</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="wrap"><b>混元九龍太子</b><h1>聖誕祈福科儀</h1><p>線上報名｜依照步驟完成即可</p></div></header>
<main class="wrap">
<div class="progress"><span class="on">1<br><small>報名方式</small></span><span>2<br><small>填寫資料</small></span><span>3<br><small>確認資料</small></span><span>4<br><small>傳送報名單</small></span></div>
<section id="s1" class="page on"><h2>步驟 1｜選擇報名方式</h2><button class="mode" data-mode="single">👤<b>個人報名</b><small>只報名 1 位</small></button><button class="mode" data-mode="group">👨‍👩‍👧‍👦<b>團體／家庭報名</b><small>可以連續新增多人</small></button><button id="next1" class="primary" disabled>請先選擇報名方式</button></section>
<section id="s2" class="page"><h2 id="formTitle">步驟 2｜填寫資料</h2>
<label>姓名 *</label><input id="name" placeholder="請輸入姓名">
<label>生辰輸入方式 *</label><div class="two"><button class="cal" data-cal="solar">國曆</button><button class="cal" data-cal="lunar">農曆</button></div>
<div id="solarBox" class="hide"><label>國曆出生日期 *</label><input id="solar" type="date"><div id="converted" class="note">選擇日期後會自動整理成農曆</div></div>
<div id="lunarBox" class="hide"><label>農曆生辰 *</label><div class="three"><input id="roc" type="number" inputmode="numeric" placeholder="民國年，如82"><select id="lm"></select><select id="ld"></select></div></div>
<label>時辰 *</label><div id="times" class="grid"></div><label>生肖 *</label><div id="zodiacs" class="grid"></div>
<label>地址 *</label><input id="addr" placeholder="請輸入地址">
<label>選擇科儀 *</label>
<button class="ritual" data-r="lamp"><b>七星元辰燈</b><span>NT$200</span><small>點此選擇</small></button>
<button class="ritual" data-r="dou"><b>祈安禮斗</b><span>NT$1,200</span><small>限25人・點此選擇</small></button>
<button class="ritual" data-r="gaiji"><b>祭改</b><span>NT$200</span><small>點此選擇</small></button>
<div id="attBox" class="hide"><label>祭改本人是否到場 *</label><div class="two"><button class="att" data-att="yes">本人會到場</button><button class="att" data-att="no">本人不克到場</button></div><div id="cloth" class="warn hide">⚠️ 未到場請提前準備本人衣物放置宮廟。</div></div>
<div id="err" class="warn hide"></div><div class="total">此位金額 <b id="ptotal">NT$0</b></div><button id="savePerson" class="primary">✓ 加入報名名單</button></section>
<section id="people" class="page"><h2>團體／家庭報名名單</h2><div id="plist"></div><button id="add" class="secondary">＋ 新增下一位</button><button id="toConfirm" class="primary">下一步：確認全部資料 →</button></section>
<section id="s3" class="page"><h2>步驟 3｜確認報名資料</h2><p>請確認姓名、科儀及總金額。</p><div id="summary"></div><div class="grand">應繳總額 <b id="grand">NT$0</b></div><div class="notice">⚠️ 祈安禮斗限25人，名額以官方 LINE 工作人員確認為準。</div><button id="back" class="secondary">← 返回修改</button><button id="finish" class="primary">資料正確，下一步 →</button></section>
<section id="s4" class="page"><h2>步驟 4｜傳送報名單</h2><div id="slip" class="slip"></div><button id="share" class="line">📤 傳送報名單</button><p class="note">按下後會開啟手機分享選單；請選擇 LINE 傳送。</p><button id="download" class="secondary">⬇️ 無法分享？儲存圖片</button><div id="fallback"></div><div class="warn">⚠️ 傳送至官方 LINE 並收到工作人員確認後，才算完成報名。</div><a class="line secondaryLine" href="https://lin.ee/u1LZ3VU" target="_blank">前往官方 LINE</a></section>
</main><script src="app.js"></script></body></html>
